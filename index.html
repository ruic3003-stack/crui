<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粒子控制 v0.2 纯净回归版</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        canvas { display: block; }
        #status { position: absolute; top: 10px; left: 10px; color: #00f5ff; font-family: sans-serif; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } } </script>
</head>
<body>
    <div id="status">连接中...</div>
    <script type="module">
        import * as THREE from 'three';
        // 渲染基础设置
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 创建粒子
        const count = 5000;
        const geom = new THREE.BufferGeometry();
        const pos = new Float32Array(count * 3);
        for(let i=0; i<count*3; i++) pos[i] = (Math.random()-0.5)*10;
        geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const mat = new THREE.PointsMaterial({size: 0.05, color: 0x00f5ff});
        const particles = new THREE.Points(geom, mat);
        scene.add(particles);
        camera.position.z = 5;

        // 手势识别
        const hands = new Hands({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1 });
        hands.onResults(res => {
            if (res.multiHandLandmarks?.length > 0) {
                document.getElementById('status').innerText = "识别正常";
                const lm = res.multiHandLandmarks[0];
                const palm = lm[0];
                // 简单的位置映射
                particles.position.x = (palm.x - 0.5) * 10;
                particles.position.y = -(palm.y - 0.5) * 10;
                
                // 简单的抓取缩放判定
                const dist = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
                particles.scale.setScalar(dist < 0.1 ? 2 : 1);
            }
        });

        const video = document.createElement('video');
        const cameraUtils = new Camera(video, { onFrame: async () => await hands.send({image: video}), width: 640, height: 480 });
        cameraUtils.start();

        function animate() {
            requestAnimationFrame(animate);
            particles.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
