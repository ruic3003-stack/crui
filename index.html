<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>粒子·星海幻境 v0.3 终极掌控版</title>
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000002; font-family:-apple-system,sans-serif; color:#fff; user-select:none; touch-action:none; }
        canvas { display:block; width:100% !important; height:100% !important; }
        #ui-layer { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; box-sizing:border-box; }
        .header { padding:15px; background:linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0)); }
        .title { font-size:20px; font-weight:400; letter-spacing:1px; text-shadow:0 0 8px rgba(0,245,255,0.8); margin:0; }
        .subtitle { font-size:10px; color:#00f5ff; opacity:0.6; margin-top:3px; }
        #status { position:absolute; top:15px; right:15px; font-size:11px; color:#00f5ff; background:rgba(0,245,255,0.15); padding:4px 10px; border-radius:20px; border:1px solid rgba(0,245,255,0.3); backdrop-filter:blur(8px); }
        
        /* 侧边滑动控制面板 */
        .control-panel { position:absolute; left:15px; top:35%; transform:translateY(-50%); display:flex; flex-direction:column; gap:15px; pointer-events:auto; background:rgba(0,5,15,0.4); padding:12px; border-radius:12px; border:1px solid rgba(0,245,255,0.15); backdrop-filter:blur(5px); }
        .control-group { display:flex; flex-direction:column; gap:4px; }
        .control-group label { font-size:10px; color:#00f5ff; opacity:0.8; text-shadow:0 0 3px rgba(0,245,255,0.5); }
        .control-group input[type=range] { -webkit-appearance:none; width:100px; height:4px; background:rgba(0,245,255,0.2); border-radius:2px; outline:none; }
        .control-group input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#00f5ff; box-shadow:0 0 6px #00f5ff; cursor:pointer; }
        
        .bottom-bar { padding:10px; display:flex; justify-content:center; gap:6px; pointer-events:auto; flex-wrap:wrap; background:linear-gradient(to top, rgba(0,0,0,0.6), rgba(0,0,0,0)); }
        button { background:rgba(0,245,255,0.05); border:1px solid rgba(0,245,255,0.3); color:#00f5ff; padding:5px 10px; font-size:11px; border-radius:12px; cursor:pointer; transition:all 0.15s; }
        button:hover, button.active { background:rgba(0,245,255,0.3); box-shadow:0 0 8px rgba(0,245,255,0.5); border-color:#00f5ff; }
        #video-input { position:absolute; bottom:15px; right:15px; width:50px; height:38px; border:1px solid rgba(0,245,255,0.2); transform:scaleX(-1); border-radius:4px; opacity:0.15; pointer-events:none; }
    </style>
    <script src="https://unpkg.com/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } } </script>
</head>
<body>
    <div id="ui-layer">
        <div class="header"><h1 class="title">星海幻境 v0.3</h1><div class="subtitle">极速指引 ＆ 甩动惯性掌控版</div></div>
        <div id="status">连通相机中...</div>
        
        <div class="control-panel">
            <div class="control-group"><label>粒子大小</label><input id="sld-size" type="range" min="1" max="15" value="4" step="0.5"></div>
            <div class="control-group"><label>星海色相</label><input id="sld-color" type="range" min="0" max="360" value="185"></div>
        </div>

        <div class="bottom-bar">
            <button id="btn-solarsystem" class="active">太阳系</button>
            <button id="btn-saturn">土星</button>
            <button id="btn-earth">地球</button>
            <button id="btn-galaxy">银河系</button>
            <button id="btn-rose">玫瑰花</button>
            <button id="btn-heart">饱满心</button>
        </div>
    </div>
    <video id="video-input" autoplay playsinline></video>
    <script type="module">
        import * as THREE from 'three';

        const PARTICLE_COUNT = 10000; 
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 5000); camera.position.z = 700;
        const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); document.body.appendChild(renderer.domElement);

        function createTexture() {
            const c = document.createElement('canvas'); c.width = 32; c.height = 32;
            const ctx = c.getContext('2d'), g = ctx.createRadialGradient(16,16,0,16,16,16);
            g.addColorStop(0, '#ffffff'); g.addColorStop(0.3, 'rgba(255,255,255,0.9)'); g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g; ctx.fillRect(0,0,32,32); return new THREE.CanvasTexture(c);
        }

        const geometry = new THREE.BufferGeometry(), positions = new Float32Array(PARTICLE_COUNT * 3), targetPositions = new Float32Array(PARTICLE_COUNT * 3);
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            positions[i*3] = (Math.random()-0.5)*300; positions[i*3+1] = (Math.random()-0.5)*300; positions[i*3+2] = (Math.random()-0.5)*300;
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        
        const material = new THREE.ShaderMaterial({
            uniforms: { color: { value: new THREE.Color() }, tex: { value: createTexture() }, pSize: { value: 4.0 } },
            vertexShader: `uniform float pSize; void main() { vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = pSize * (700.0 / -mv.z); gl_Position = projectionMatrix * mv; }`,
            fragmentShader: `uniform vec3 color; uniform sampler2D tex; void main() { gl_FragColor = vec4(color, 1.0) * texture2D(tex, gl_PointCoord); }`,
            blending: THREE.AdditiveBlending, depthTest: false, transparent: true
        });
        const particleSystem = new THREE.Points(geometry, material); scene.add(particleSystem);

        let baseColor = new THREE.Color().setHSL(185/360, 1.0, 0.5); material.uniforms.color.value = baseColor;

        let mode = 'solarsystem';
        function updateShape() {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                let idx = i * 3;
                if (mode === 'solarsystem') {
                    if (i < PARTICLE_COUNT * 0.25) {
                        let u = Math.random(), v = Math.random(), t = u * 2 * Math.PI, p = Math.acos(2 * v - 1), r = Math.random() * 40;
                        targetPositions[idx] = r * Math.sin(p) * Math.cos(t); targetPositions[idx+1] = r * Math.sin(p) * Math.sin(t); targetPositions[idx+2] = r * Math.cos(p);
                    } else {
                        let r = 90 + (i % 5) * 45 + Math.random() * 10, t = Math.random() * Math.PI * 2;
                        targetPositions[idx] = Math.cos(t) * r; targetPositions[idx+1] = (Math.random() - 0.5) * 6; targetPositions[idx+2] = Math.sin(t) * r;
                    }
                } else if (mode === 'saturn') {
                    if (i < PARTICLE_COUNT * 0.4) {
                        let u = Math.random(), v = Math.random(), t = u * 2 * Math.PI, p = Math.acos(2 * v - 1), r = Math.random() * 75;
                        targetPositions[idx] = r * Math.sin(p) * Math.cos(t); targetPositions[idx+1] = r * Math.sin(p) * Math.sin(t) * 0.8; targetPositions[idx+2] = r * Math.cos(p);
                    } else {
                        let r = 120 + Math.random() * 100, t = Math.random() * Math.PI * 2;
                        targetPositions[idx] = Math.cos(t) * r; targetPositions[idx+1] = Math.sin(t) * r * 0.25; targetPositions[idx+2] = Math.sin(t) * r * 0.7;
                    }
                } else if (mode === 'earth') {
                    let u = Math.random(), v = Math.random(), t = u * 2 * Math.PI, p = Math.acos(2 * v - 1), r = 150 + (Math.random()-0.5)*5;
                    targetPositions[idx] = r * Math.sin(p) * Math.cos(t); targetPositions[idx+1] = r * Math.sin(p) * Math.sin(t); targetPositions[idx+2] = r * Math.cos(p);
                } else if (mode === 'galaxy') {
                    let arm = i % 2 === 0 ? 0 : Math.PI, r = Math.random() * 260, theta = r * 0.045 + arm + (Math.random()-0.5)*0.2;
                    targetPositions[idx] = Math.cos(theta) * r; targetPositions[idx+1] = (Math.random() - 0.5) * (30 - r * 0.08); targetPositions[idx+2] = Math.sin(theta) * r;
                } else if (mode === 'rose') {
                    let t = (i / PARTICLE_COUNT) * Math.PI * 14, k = 4, r = 170 * Math.sin(k * t) * (0.6 + 0.4 * Math.random());
                    targetPositions[idx] = r * Math.cos(t); targetPositions[idx+1] = (i / PARTICLE_COUNT) * 120 - 60; targetPositions[idx+2] = r * Math.sin(t);
                } else if (mode === 'heart') {
                    let theta = Math.random() * Math.PI * 2, phi = Math.acos(Math.random() * 2 - 1), r = 12.5;
                    let x = r * Math.sin(phi) * Math.cos(theta), y = r * Math.sin(phi) * Math.sin(theta), z = r * Math.cos(phi);
                    y = y + 2.2 * Math.sqrt(Math.abs(x)); targetPositions[idx] = x * 10; targetPositions[idx+1] = y * 10 - 50; targetPositions[idx+2] = z * 9;
                }
            }
        }
        updateShape();

        const modes = ['solarsystem','saturn','earth','galaxy','rose','heart'];
        modes.forEach(id => {
            document.getElementById('btn-'+id).onclick = (e) => {
                mode = id; modes.forEach(b => document.getElementById('btn-'+b).className='');
                e.target.className='active'; updateShape();
            };
        });

        document.getElementById('sld-size').oninput = (e) => { material.uniforms.pSize.value = parseFloat(e.target.value); };
        document.getElementById('sld-color').oninput = (e) => { baseColor.setHSL(parseInt(e.target.value)/360, 1.0, 0.5); material.uniforms.color.value = baseColor; };
        let handState = 'none', fingerX = 0, pointingTime = 0;
        let scaleFactor = 1.0, targetScaleFactor = 1.0;
        
        // 惯性动力学变量
        let rotVelocityX = 0, rotVelocityY = 0; 
        let lastHandPos = new THREE.Vector2(), hasLastPos = false;
        
        const statEl = document.getElementById('status'), vid = document.getElementById('video-input');

        // 极限降维优化：模型复杂度设为 0，专门激发移动端硬件潜能，消除延迟
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

        hands.onResults((res) => {
            if (res.multiHandLandmarks?.length > 0) {
                statEl.innerText = "捕获成功 (掌控中)"; statEl.style.color = "#00ff88"; statEl.style.borderColor = "#00ff88";
                const lm = res.multiHandLandmarks[0];
                
                // 1. 计算手掌抓取/握拳程度 (大拇指4 到 小拇指20 的距离)
                const d4_20 = Math.hypot(lm[4].x - lm[20].x, lm[4].y - lm[20].y);
                const isFist = (Math.hypot(lm[8].x-lm[5].x, lm[8].y-lm[5].y) < 0.08) && (Math.hypot(lm[12].x-lm[9].x, lm[12].y-lm[9].y) < 0.08);

                if (isFist) {
                    handState = 'grab'; targetScaleFactor = 2.6; // 完全握拳状态：体积放大到极限 2.6 倍
                } else if (d4_20 < 0.18) {
                    handState = 'grab'; targetScaleFactor = 1.8; // 半抓取状态：放大 1.8 倍
                } else {
                    // 2. 检测是否为纯粹的“食指指引”模式
                    const isIndexUp = lm[8].y < lm[6].y;
                    const isMiddleDown = lm[12].y > lm[10].y;
                    
                    if (isIndexUp && isMiddleDown) {
                        handState = 'pointing';
                        fingerX = (lm[8].x - 0.5) * 2; // 食指偏离中心水平线的比例 (-1 到 1)
                    } else {
                        handState = 'free'; targetScaleFactor = 1.0;
                    }
                }

                // 3. 核心算法：捕获猛烈甩手动作并转化为旋转惯性
                let currentHandPos = new THREE.Vector2(lm[9].x, lm[9].y); // 使用掌心点作为质点
                if (hasLastPos) {
                    let vx = (currentHandPos.x - lastHandPos.x) * 45; // 放大速度传感系数
                    let vy = (currentHandPos.y - lastHandPos.y) * 45;
                    
                    // 如果产生剧烈甩动速度，直接注入旋转引擎
                    if (Math.abs(vx) > 0.4 || Math.abs(vy) > 0.4) {
                        rotVelocityY = -vx; // 左右甩动 -> 绕Y轴疯狂旋转
                        rotVelocityX = -vy; // 上下甩动 -> 绕X轴疯狂旋转
                    }
                }
                lastHandPos.copy(currentHandPos); hasLastPos = true;
            } else {
                statEl.innerText = "寻星中 (请挥手)"; statEl.style.color = "#00f5ff"; statEl.style.borderColor = "rgba(0,245,255,0.3)";
                handState = 'none'; targetScaleFactor = 1.0; hasLastPos = false;
            }
        });

        let isProcessing = false;
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: 320, height: 240 } // 极致压低相机分辨率，换取绝对流畅度
                });
                vid.srcObject = stream;
                vid.addEventListener('playing', () => {
                    function predictLoop() {
                        if (vid.readyState >= 2 && !isProcessing) {
                            isProcessing = true;
                            hands.send({image: vid}).then(() => { isProcessing = false; }).catch(() => { isProcessing = false; });
                        }
                        requestAnimationFrame(predictLoop);
                    }
                    predictLoop();
                });
                vid.play();
            } catch (err) { statEl.innerText = "相机异常，请检查权限"; }
        }
        if (document.readyState === 'complete') { startCamera(); } else { window.addEventListener('load', startCamera); }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime(), posArr = geometry.attributes.position.array;
            
            // 弹性平滑缩放过渡
            scaleFactor += (targetScaleFactor - scaleFactor) * 0.12;

            // 1. 处理食指指引原地蓄力加速旋转逻辑
            if (handState === 'pointing') {
                pointingTime += 0.016; // 只要指着，时间就不断累积
                let speedMultiplier = 0.03 + pointingTime * 0.15; // 指得越久，系数越高
                particleSystem.rotation.y += fingerX * speedMultiplier; 
            } else {
                pointingTime = 0; // 只要收回，蓄力立刻清零
            }

            // 2. 应用甩手带来的物理滑行和摩擦力减速机制
            particleSystem.rotation.x += rotVelocityX;
            particleSystem.rotation.y += rotVelocityY;
            rotVelocityX *= 0.93; // 物理摩擦系数，让旋转逐渐顺滑平稳停下
            rotVelocityY *= 0.93;

            // 3. 如果没有任何手势，星体保持极慢速度的基本自转
            if (handState === 'none') {
                particleSystem.rotation.y += 0.005;
            }

            // 4. 驱动粒子位置变换矩阵
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                let idx = i * 3;
                let tx = targetPositions[idx] * scaleFactor;
                let ty = targetPositions[idx+1] * scaleFactor;
                let tz = targetPositions[idx+2] * scaleFactor;

                // 注入细微呼吸微振幅，增强灵动感
                tx += Math.sin(time * 2 + i) * 0.4;
                ty += Math.cos(time * 1.5 + i) * 0.4;

                posArr[idx] += (tx - posArr[idx]) * 0.1;
                posArr[idx+1] += (ty - posArr[idx+1]) * 0.1;
                posArr[idx+2] += (tz - posArr[idx+2]) * 0.1;
            }
            geometry.attributes.position.needsUpdate = true; renderer.render(scene, camera);
        }
        animate();

        window.onresize = () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); };
    </script>
</body>
</html>
